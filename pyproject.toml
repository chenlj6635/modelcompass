[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelcompass"
version = "0.1.0"
description = "Personal scenario model selection with evidence-based scoring and Pareto analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ModelCompass contributors" }]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "jinja2>=3.1", "plotly>=5.20", "uvicorn>=0.29"]
test = ["pytest>=8.0"]

[project.scripts]
modelcompass = "modelcompass.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100